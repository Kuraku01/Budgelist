name: Automated Release & Hotfix OTA Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'OTA Channel to publish (stable = dist.zip, unstable = dist-unstable.zip)'
        required: true
        default: 'unstable'
        type: choice
        options:
          - unstable
          - stable

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish OTA Live Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Release Version & Determine OTA Channel
        id: get_version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          PACKAGE_VER=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VER" == v* ]]; then
            echo "version=$PACKAGE_VER" >> $GITHUB_OUTPUT
          else
            echo "version=v$PACKAGE_VER" >> $GITHUB_OUTPUT
          fi

          if [[ "$REF_TYPE" == "tag" ]] || [[ "$DISPATCH_CHANNEL" == "stable" ]] || [[ "$COMMIT_MSG" == *"[stable-ota]"* ]]; then
            echo "zip_name=dist.zip" >> $GITHUB_OUTPUT
            echo "channel=stable" >> $GITHUB_OUTPUT
          else
            echo "zip_name=dist-unstable.zip" >> $GITHUB_OUTPUT
            echo "channel=unstable" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Build Modular Web Assets (src -> www)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Package Web Assets Bundle (${{ steps.get_version.outputs.zip_name }})
        run: |
          cd www
          zip -r "../${{ steps.get_version.outputs.zip_name }}" app.js style.css index.html firebase-config.js lib/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.version }}
          name: Budgelist ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.version }}
          files: |
            ${{ steps.get_version.outputs.zip_name }}
          overwrite_files: true
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate & Attach Rate-Limit-Free OTA Manifest (ota-manifest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.version }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/${REL_TAG}" \
            --jq '{tag_name: .tag_name, html_url: .html_url, body: (.body // ""), published_at: .published_at, assets: [.assets[] | select(.name != "ota-manifest.json") | {id: .id, name: .name, size: .size, updated_at: .updated_at, browser_download_url: .browser_download_url}]}' \
            > ota-manifest.json
          gh release upload "${REL_TAG}" ota-manifest.json --clobber
