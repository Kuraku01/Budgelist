name: Automated Release & Hotfix OTA Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish OTA Live Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Release Version
        id: get_version
        run: |
          PACKAGE_VER=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VER" == v* ]]; then
            echo "version=$PACKAGE_VER" >> $GITHUB_OUTPUT
          else
            echo "version=v$PACKAGE_VER" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Package Web Assets Bundle (dist.zip)
        run: |
          cd www
          zip -r ../dist.zip app.js style.css index.html firebase-config.js lib/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.version }}
          name: Budgelist ${{ github.ref_type == 'tag' && github.ref_name || steps.get_version.outputs.version }}
          files: |
            dist.zip
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
